server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Les assets portent une empreinte dans leur nom (index-DqmTqdi7.js) : leur
  # contenu ne change JAMAIS pour une empreinte donnée. On peut donc les mettre
  # en cache très longtemps, et « immutable » évite même la revalidation.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html, lui, ne DOIT jamais être mis en cache.
  #
  # Sans en-tête explicite, le navigateur applique un cache heuristique : il
  # garde la page « fraîche » un moment de son propre chef. Après un rebuild,
  # les empreintes des assets changent — un index.html périmé pointe alors vers
  # des fichiers qui n'existent plus. Le JS encore en cache affiche bien le
  # formulaire, mais la CSS part en 404 : page sans mise en forme, impossible à
  # utiliser. C'est exactement ce qui a été observé sur la console.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri $uri/ /index.html;
  }
}
