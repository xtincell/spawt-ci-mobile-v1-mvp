name: Android APK native QA
on:
  push:
    tags: ['qa-android-*']
  workflow_dispatch:
    inputs:
      apk_url:
        description: APK Expo à contrôler
        required: true
        type: string
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Résoudre et télécharger l'APK ciblé
        id: apk
        env:
          APK_INPUT: ${{ inputs.apk_url }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          python3 - <<'PYCODE'
          import json,os,pathlib,re,urllib.request
          out=pathlib.Path('android-proof'); out.mkdir(exist_ok=True)
          config=json.loads(pathlib.Path('documentation/android-qa.json').read_text())
          url=os.environ.get('APK_INPUT')
          if not url:
            query='query($appId:String!){app{byId(appId:$appId){builds(offset:0,limit:8){id status platform appVersion appBuildVersion gitCommitHash artifacts{buildUrl} queuePosition estimatedWaitTimeLeftSeconds}}}}'
            req=urllib.request.Request('https://api.expo.dev/graphql',data=json.dumps({'query':query,'variables':{'appId':'15ac2301-e901-4caa-a8c8-864c6621bcd0'}}).encode(),headers={'Content-Type':'application/json','Authorization':'Bearer '+os.environ['EXPO_TOKEN']})
            result=json.load(urllib.request.urlopen(req,timeout=30))
            if result.get('errors'): raise RuntimeError(json.dumps(result['errors']))
            builds=result['data']['app']['byId']['builds']
            print(json.dumps(builds,indent=2))
            (out/'eas-builds.json').write_text(json.dumps(builds,indent=2))
            match=next((b for b in builds if b['platform']=='ANDROID' and b['appBuildVersion']==str(config['build'])),None)
            url=match['artifacts']['buildUrl'] if match and match['status']=='FINISHED' and match['artifacts'] else None
          if url:
            if not re.fullmatch(r'https://expo.dev/artifacts/eas/[A-Za-z0-9]+\.apk',url): raise ValueError('APK origin unsupported')
            urllib.request.urlretrieve(url,'spawt.apk')
            (out/'apk.url').write_text(url+'\n')
          else: print('APK encore en compilation : aucune recette exécutée.')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('ready='+str(bool(url)).lower()+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('SPAWT_QA_MODE='+config['mode']+'\n')
          PYCODE
      - name: Préparer Android 35 avec KVM
        if: steps.apk.outputs.ready == 'true'
        run: |
          sudo chmod 666 /dev/kvm
          sdkmanager 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64' >/dev/null
          echo no | avdmanager create avd -n spawt-qa -k 'system-images;android-35;google_apis;x86_64' --force
          "$ANDROID_HOME/emulator/emulator" -avd spawt-qa -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 3072 -cores 2 > emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = '1' ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = '1'
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell settings put secure show_ime_with_hard_keyboard 1
          adb install -r spawt.apk
      - name: Recette native
        if: steps.apk.outputs.ready == 'true'
        env:
          SPAWT_QA_PHONE: '+2250000000193'
        run: python3 scripts/android-qa.py
      - name: Diagnostic Android
        if: always() && steps.apk.outputs.ready == 'true'
        run: |
          mkdir -p android-proof
          adb logcat -d -s AndroidRuntime ReactNativeJS > android-proof/logcat.txt
          adb shell dumpsys package com.upgraders.spawt > android-proof/package.txt
          cp emulator.log android-proof/emulator.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-proof
          path: android-proof
          retention-days: 14
