name: Android APK native QA
on:
  push:
    tags: ['qa-android-*']
  workflow_dispatch:
    inputs:
      apk_url:
        description: APK Expo à contrôler
        required: true
        type: string
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: ${{ runner.temp }}/android-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Résoudre et télécharger l'APK ciblé
        id: apk
        env:
          APK_INPUT: ${{ inputs.apk_url }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          fs.mkdirSync('android-proof',{recursive:true});
          const config=JSON.parse(fs.readFileSync('documentation/android-qa.json','utf8'));
          let url=process.env.APK_INPUT;
          if(!url){
            const query='query($appId:String!){app{byId(appId:$appId){builds(offset:0,limit:8){id status platform appVersion appBuildVersion gitCommitHash artifacts{buildUrl} queuePosition estimatedWaitTimeLeftSeconds}}}}';
            const response=await fetch('https://api.expo.dev/graphql',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+process.env.EXPO_TOKEN,'user-agent':'eas-cli/22.5.0'},body:JSON.stringify({query,variables:{appId:'15ac2301-e901-4caa-a8c8-864c6621bcd0'}})});
            const result=await response.json();
            if(result.errors) throw new Error(JSON.stringify(result.errors));
            const builds=result.data.app.byId.builds;
            console.log(JSON.stringify(builds,null,2));
            fs.writeFileSync('android-proof/eas-builds.json',JSON.stringify(builds,null,2));
            const match=builds.find(b=>b.platform==='ANDROID' && b.appBuildVersion===String(config.build));
            url=match?.status==='FINISHED' ? match.artifacts?.buildUrl : null;
          }
          if(url){
            if(!/^https:\/\/expo\.dev\/artifacts\/eas\/[A-Za-z0-9_-]+\.apk$/.test(url)) throw new Error('APK origin unsupported');
            const response=await fetch(url);
            if(!response.ok) throw new Error('APK HTTP '+response.status);
            fs.writeFileSync('spawt.apk',Buffer.from(await response.arrayBuffer()));
            fs.writeFileSync('android-proof/apk.url',url+'\n');
          }else console.log('APK encore en compilation : aucune recette exécutée.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'ready='+Boolean(url)+'\n');
          fs.appendFileSync(process.env.GITHUB_ENV,'SPAWT_QA_MODE='+config.mode+'\n');
          JS
      - name: Préparer Android 35 avec KVM
        if: steps.apk.outputs.ready == 'true'
        run: |
          sudo chmod 666 /dev/kvm
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o cmdline.zip
          echo '5fdcc763663eefb86a5b8879697aa6088b041e70 cmdline.zip' | sha1sum -c -
          unzip -q cmdline.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64' >/dev/null
          echo no | avdmanager create avd -n spawt-qa -k 'system-images;android-35;google_apis;x86_64' --force
          "$ANDROID_HOME/emulator/emulator" -avd spawt-qa -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 3072 -cores 2 > emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = '1' ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = '1'
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell settings put secure show_ime_with_hard_keyboard 1
          adb install -r spawt.apk
      - name: Recette native
        if: steps.apk.outputs.ready == 'true'
        env:
          SPAWT_QA_PHONE: '+2250000000193'
        run: python3 scripts/android-qa.py
      - name: Diagnostic Android
        if: always() && steps.apk.outputs.ready == 'true'
        run: |
          mkdir -p android-proof
          timeout 20s adb logcat -d -s AndroidRuntime ReactNativeJS > android-proof/logcat.txt || true
          timeout 20s adb shell dumpsys package com.upgraders.spawt > android-proof/package.txt || true
          cp emulator.log android-proof/emulator.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-proof
          path: android-proof
          retention-days: 14
