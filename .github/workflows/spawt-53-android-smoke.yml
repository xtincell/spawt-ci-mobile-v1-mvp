name: SPAWT 53 accelerated Android smoke
on:
  push:
    branches: ["codex/spawt-53-android-smoke"]
    paths: [".github/workflows/spawt-53-android-smoke.yml"]
permissions:
  actions: read
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Verify the pinned release candidate and make a local-only QA APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/15261107156/zip" > spawt53.zip
          echo "81bf09f668c5aa6118e17824962c70e3352c7bea2eb48d58729de6a4e8996db2  spawt53.zip" | sha256sum -c
          unzip -q spawt53.zip spawt-1.1.8-build53.aab source-commit.txt
          test "$(cat source-commit.txt)" = 52d697ce88af27f2265b721cde186416b6a53790
          echo "7095b2bfb6d99f777ec978780473439adef32c74f7a1364dc70413eb9f8388f7  spawt-1.1.8-build53.aab" | sha256sum -c
          curl -fLsS --retry 2 'https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar' -o bundletool.jar
          keytool -genkeypair -storetype PKCS12 -keystore qa.p12 -storepass qa-local-only -keypass qa-local-only -alias qa -keyalg RSA -keysize 2048 -dname 'CN=Ephemeral smoke only' -validity 1
          java -jar bundletool.jar build-apks --bundle=spawt-1.1.8-build53.aab --output=spawt53.apks --mode=universal --ks=qa.p12 --ks-pass=pass:qa-local-only --ks-key-alias=qa --key-pass=pass:qa-local-only
          unzip -q spawt53.apks universal.apk
      - name: Check startup on an accelerated Android 34 image
        run: |
          set -euo pipefail
          test -c /dev/kvm
          if ! [[ -r /dev/kvm && -w /dev/kvm ]]; then
            sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          fi
          sdk="$ANDROID_HOME"
          adb="$sdk/platform-tools/adb"
          sdkman="$sdk/cmdline-tools/latest/bin/sdkmanager"
          image='system-images;android-34;google_apis;x86_64'
          yes | "$sdkman" --licenses >/dev/null || true
          "$sdkman" --install emulator platform-tools "$image" >/dev/null
          export ANDROID_AVD_HOME="$RUNNER_TEMP/qa-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$sdk/cmdline-tools/latest/bin/avdmanager" create avd --force --name spawt53-smoke --package "$image"
          "$sdk/emulator/emulator" -avd spawt53-smoke -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -cores 2 -memory 2048 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          ep=$!
          trap 'kill "$ep" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do
            [[ "$(timeout 3 "$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != 1 ]] || break
            kill -0 "$ep" || { tail -35 "$RUNNER_TEMP/emulator.log"; exit 1; }
            sleep 3
          done
          test "$(timeout 10 "$adb" shell getprop sys.boot_completed | tr -d '\r')" = 1
          "$adb" shell pm path com.google.android.gms | grep -q '^package:'
          "$adb" shell input keyevent 82
          "$adb" install "$RUNNER_TEMP/universal.apk"
          "$adb" shell dumpsys package com.upgraders.spawt > "$RUNNER_TEMP/package.txt"
          grep -F 'versionCode=53 ' "$RUNNER_TEMP/package.txt"
          "$adb" shell am start -W -n com.upgraders.spawt/.MainActivity
          for _ in $(seq 1 12); do
            if timeout 10 "$adb" shell uiautomator dump /sdcard/qa.xml >/dev/null 2>&1 &&
               "$adb" shell cat /sdcard/qa.xml | grep -qiE 'Rejoindre la bande|SPAWT.*[Aa]bidjan|[Aa]bidjan.*SPAWT'; then
              echo "SPAWT onboarding visible on Android 34 with Google Play Services."
              exit 0
            fi
            sleep 2
          done
          echo "SPAWT onboarding was not observed; login and Guet were not tested."
          exit 1
