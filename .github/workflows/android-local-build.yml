name: Android preview local build
on:
  push:
    tags: ['local-build-android-*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Épingler le code applicatif déjà contrôlé
        run: |
          SOURCE=$(node -p "require('./documentation/android-qa.json').sourceCommit")
          test "$SOURCE" = '56d8b680a1f2226639bd4f9e0c2c5afe3109b7fd'
          git fetch origin "$SOURCE"
          git checkout --detach "$SOURCE"
          test "$(git rev-parse HEAD)" = "$SOURCE"
          echo "SPAWT_APK_SOURCE=$SOURCE" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer les outils Android requis
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1' >/dev/null
      - name: Installer les dépendances et épingler le backend
        run: |
          npm ci --prefix app --legacy-peer-deps
          node scripts/check-eas-env.mjs
          node scripts/pin-backend-in-manifest.mjs preview
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const path='app/app.json';
          const config=JSON.parse(fs.readFileSync(path));
          if(config.expo.version!=='1.1.1' || config.expo.android.versionCode!==26) throw new Error('Version inattendue');
          config.expo.extra.buildDate='2026-10-10';
          fs.writeFileSync(path,JSON.stringify(config,null,2)+'\n');
          JS
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 22.5.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Compiler avec la signature EAS existante
        working-directory: app
        env:
          EXPO_PUBLIC_BUILD_DATE: '2026-10-10'
        run: eas build --platform android --profile preview --non-interactive --local --output "$GITHUB_WORKSPACE/spawt-1.1.1-build26.apk"
      - name: Vérifier la signature et tracer l'APK
        run: |
          curl -fsSL 'https://expo.dev/artifacts/eas/nRbb5bhMV3ExylApZjfy6vJlwaSfq1dF83XcBoHLNTA.apk' -o reference25.apk
          echo '25599e852085a983004e939d7d40f967e8c0cebcdab466910c244f12c5ddc5c0 reference25.apk' | sha256sum -c -
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs reference25.apk > reference-cert.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs spawt-1.1.1-build26.apk > apk-cert.txt
          diff <(sed -n '/Signer #1 certificate SHA-256 digest:/p' reference-cert.txt) <(sed -n '/Signer #1 certificate SHA-256 digest:/p' apk-cert.txt)
          python3 - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          path=pathlib.Path('spawt-1.1.1-build26.apk')
          with zipfile.ZipFile(path) as archive:
              assert archive.testzip() is None
          data={'version':'1.1.1','build':26,'sourceCommit':os.environ['SPAWT_APK_SOURCE'],'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'bytes':path.stat().st_size,'signatureMatchesBuild25':True,'zipCrcPassed':True,'runId':int(os.environ['GITHUB_RUN_ID'])}
          pathlib.Path('apk-metadata.json').write_text(json.dumps(data,indent=2)+'\n')
          print(json.dumps(data))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            spawt-1.1.1-build26.apk
            apk-metadata.json
            apk-cert.txt
          retention-days: 14
