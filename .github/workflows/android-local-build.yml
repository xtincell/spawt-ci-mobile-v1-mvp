name: Android preview local build
on:
  push:
    tags: ['local-build-android-*']
    branches: ['codex/editorial-research-admin']
    paths: ['documentation/android-build36.json']
  workflow_dispatch:
    inputs:
      recipe:
        description: Recette de compilation déjà contrôlée
        type: string
        default: documentation/android-build36.json
        required: true
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
      GRADLE_USER_HOME: /tmp/spawt-gradle
      SPAWT_BUILD_RECIPE: ${{ inputs.recipe || 'documentation/android-build36.json' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recevoir la recette et sa CI avant compilation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          const recipePath=process.env.SPAWT_BUILD_RECIPE;
          if(!/^documentation\/android-build[0-9]+\.json$/.test(recipePath)) throw new Error('Chemin de recette non autorisé');
          const rawRecipe=fs.readFileSync(recipePath,'utf8');
          const recipe=JSON.parse(rawRecipe);
          if(!/^\d+\.\d+\.\d+$/.test(recipe.version) || !Number.isSafeInteger(recipe.build) || recipe.build<1 || recipe.build>2147483647 || !/^\d{4}-\d{2}-\d{2}$/.test(recipe.buildDate) || !/^[a-f0-9]{40}$/.test(recipe.sourceCommit)) throw new Error('Recette invalide');
          if(new Date(recipe.buildDate).toISOString().slice(0,10)!==recipe.buildDate) throw new Error('Date de recette invalide');
          if(!Number.isSafeInteger(recipe.previousBuild) || recipe.previousBuild>=recipe.build || !/^[a-f0-9]{40}$/.test(recipe.previousSourceCommit) || !Number.isSafeInteger(recipe.previousBuildRun)) throw new Error('Lignée précédente absente ou invalide');
          const refs=execFileSync('git',['ls-remote','--refs','--tags','origin'],{encoding:'utf8'}).trim().split('\n');
          const occupied=refs.map(line=>line.split(/\s+/)[1]).filter(ref=>ref && ref!==process.env.GITHUB_REF).map(ref=>({ref,match:ref.match(/(?:local-build-android|build-android(?:-prod)?)-\d{4}-\d{2}-\d{2}-(\d+)$/)})).filter(x=>x.match && Number(x.match[1])>=recipe.build);
          if(occupied.length) throw new Error('Numéro natif déjà occupé par un autre tag ; sélectionner le prochain numéro après rapprochement des livraisons');
          const api='https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY;
          const headers={accept:'application/vnd.github+json','user-agent':'SPAWT-native-release',...(process.env.GH_TOKEN?{authorization:'Bearer '+process.env.GH_TOKEN}:{})};
          const read=async suffix=>{const response=await fetch(api+suffix,{headers});if(!response.ok) throw new Error('Lecture CI HTTP '+response.status);return response.json();};
          const previous=await read('/actions/runs/'+recipe.previousBuildRun);
          if(previous.status!=='completed' || previous.conclusion!=='success' || previous.head_sha!==(recipe.previousBuildRunHead || recipe.previousSourceCommit) || previous.path!=='.github/workflows/android-local-build.yml') throw new Error('Compilation précédente non reçue');
          const runs=await read('/actions/runs?head_sha='+recipe.sourceCommit+'&per_page=100');
          const run=runs.workflow_runs.filter(r=>r.head_sha===recipe.sourceCommit && r.path==='.github/workflows/app-checks.yml').sort((a,b)=>b.id-a.id)[0];
          if(!run || run.status!=='completed' || run.conclusion!=='success') throw new Error('La dernière CI source doit être terminée et verte avant compilation');
          const jobs=await read('/actions/runs/'+run.id+'/jobs?per_page=100');
          if(!['app','admin'].every(name=>jobs.jobs.some(j=>j.name===name && j.status==='completed' && j.conclusion==='success'))) throw new Error('Contrôles mobile/console incomplets');
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'spawt-build-recipe.json'),rawRecipe);
          fs.appendFileSync(process.env.GITHUB_ENV,Object.entries({SPAWT_APK_SOURCE:recipe.sourceCommit,SPAWT_PREVIOUS_SOURCE:recipe.previousSourceCommit,SPAWT_APK_VERSION:recipe.version,SPAWT_APK_BUILD:recipe.build,SPAWT_APK_DATE:recipe.buildDate,SPAWT_SOURCE_CI_RUN:run.id}).map(([k,v])=>k+'='+v+'\n').join(''));
          console.log(JSON.stringify({recipe:recipePath,source:recipe.sourceCommit,build:recipe.build,sourceCiRun:run.id}));
          JS
      - name: Épingler le code applicatif déjà contrôlé
        run: |
          git fetch origin "$SPAWT_APK_SOURCE"
          git checkout --detach "$SPAWT_APK_SOURCE"
          test "$(git rev-parse HEAD)" = "$SPAWT_APK_SOURCE"
          git merge-base --is-ancestor "$SPAWT_PREVIOUS_SOURCE" "$SPAWT_APK_SOURCE"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Dimensionner la mémoire des compilateurs
        run: |
          mkdir -p "$GRADLE_USER_HOME"
          cat > "$GRADLE_USER_HOME/gradle.properties" <<'PROPERTIES'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=2048m -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=2048m -XX:+ExitOnOutOfMemoryError
          kotlin.compiler.execution.strategy=in-process
          PROPERTIES
      - name: Installer les outils Android requis
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1' >/dev/null
      - name: Installer les dépendances et épingler le backend
        run: |
          npm ci --prefix app --legacy-peer-deps
          node scripts/conformity-check.mjs
          node scripts/check-eas-env.mjs
          node scripts/pin-backend-in-manifest.mjs preview
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const path='app/app.json';
          const config=JSON.parse(fs.readFileSync(path));
          if(config.expo.version!==process.env.SPAWT_APK_VERSION || config.expo.android.versionCode!==Number(process.env.SPAWT_APK_BUILD) || config.expo.ios.buildNumber!==process.env.SPAWT_APK_BUILD) throw new Error('La source ne correspond pas à la version de recette');
          config.expo.extra.buildDate=process.env.SPAWT_APK_DATE;
          fs.writeFileSync(path,JSON.stringify(config,null,2)+'\n');
          JS
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 22.5.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Préparer la configuration Firebase Android
        run: |
          node scripts/check-firebase-config.mjs
      - name: Compiler avec la signature EAS existante
        working-directory: app
        env:
          EXPO_PUBLIC_BUILD_DATE: ${{ env.SPAWT_APK_DATE }}
        run: eas build --platform android --profile preview --non-interactive --local --output "$GITHUB_WORKSPACE/spawt-${SPAWT_APK_VERSION}-build${SPAWT_APK_BUILD}.apk"
      - name: Vérifier la signature et tracer l'APK
        run: |
          curl -fsSL 'https://expo.dev/artifacts/eas/nRbb5bhMV3ExylApZjfy6vJlwaSfq1dF83XcBoHLNTA.apk' -o reference25.apk
          echo '25599e852085a983004e939d7d40f967e8c0cebcdab466910c244f12c5ddc5c0 reference25.apk' | sha256sum -c -
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs reference25.apk > reference-cert.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "spawt-${SPAWT_APK_VERSION}-build${SPAWT_APK_BUILD}.apk" > apk-cert.txt
          diff <(sed -n '/Signer #1 certificate SHA-256 digest:/p' reference-cert.txt) <(sed -n '/Signer #1 certificate SHA-256 digest:/p' apk-cert.txt)
          python3 - <<'PY'
          import hashlib,json,os,pathlib,zipfile,subprocess,re
          version=os.environ['SPAWT_APK_VERSION'];build=int(os.environ['SPAWT_APK_BUILD'])
          path=pathlib.Path('spawt-'+version+'-build'+str(build)+'.apk')
          tools=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools/36.0.0'
          badging=subprocess.check_output([str(tools/'aapt'),'dump','badging',str(path)],text=True)
          package=re.search(r"package: name='([^']+)' versionCode='([0-9]+)' versionName='([^']+)'",badging)
          assert package and package.groups()==('com.upgraders.spawt',str(build),version),'Identité native du binaire incorrecte'
          firebase=json.loads(pathlib.Path('app/google-services.json').read_text())
          client=next(c for c in firebase['client'] if c['client_info']['android_client_info']['package_name']=='com.upgraders.spawt')
          resources=subprocess.check_output([str(tools/'aapt'),'dump','--values','resources',str(path)],text=True)
          native_firebase={'google_app_id':client['client_info']['mobilesdk_app_id'],'gcm_defaultSenderId':firebase['project_info']['project_number'],'project_id':firebase['project_info']['project_id'],'google_api_key':client['api_key'][0]['current_key']}
          for name,value in native_firebase.items():
              blocks=re.findall(r'(?m)^\s*resource [^\n]*:string/'+re.escape(name)+r'\b[^\n]*\n(?:(?!\s*resource ).*\n)*',resources)
              assert blocks and any('"'+str(value)+'"' in block for block in blocks),'Ressource Firebase compilée incorrecte : '+name
          expected=json.loads(pathlib.Path('app/app.json').read_text())['expo']['extra']
          with zipfile.ZipFile(path) as archive:
              assert archive.testzip() is None
              config=json.loads(archive.read('assets/app.config'))
          extra=config.get('extra',config.get('expo',{}).get('extra',{}))
          assert extra.get('supabaseUrl')==expected['supabaseUrl'] and extra.get('supabaseAnonKey')==expected['supabaseAnonKey'],'Backend embarqué différent de la recette'
          recipe=pathlib.Path(os.environ['RUNNER_TEMP'])/'spawt-build-recipe.json'
          data={'version':version,'build':build,'buildDate':os.environ['SPAWT_APK_DATE'],'sourceCommit':os.environ['SPAWT_APK_SOURCE'],'sourceCiRun':int(os.environ['SPAWT_SOURCE_CI_RUN']),'recipeSha256':hashlib.sha256(recipe.read_bytes()).hexdigest(),'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'bytes':path.stat().st_size,'signatureMatchesBuild25':True,'zipCrcPassed':True,'nativePackageVerified':True,'compiledBackendConfigVerified':True,'backendUrl':extra['supabaseUrl'],'backendKeySha256':hashlib.sha256(extra['supabaseAnonKey'].encode()).hexdigest(),'runId':int(os.environ['GITHUB_RUN_ID'])}
          data.update({'compiledFirebaseConfigVerified':True,'firebaseProjectId':firebase['project_info']['project_id'],'firebaseAndroidAppId':client['client_info']['mobilesdk_app_id']})
          pathlib.Path('apk-metadata.json').write_text(json.dumps(data,indent=2)+'\n')
          print(json.dumps(data))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-apk
          if-no-files-found: ignore
          path: |
            spawt-${{ env.SPAWT_APK_VERSION }}-build${{ env.SPAWT_APK_BUILD }}.apk
            apk-metadata.json
            apk-cert.txt
          retention-days: 14
