name: EAS native build diagnostic
on:
  push:
    tags: ['diagnostic-eas-android-*']
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lire uniquement les erreurs de compilation
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          node --input-type=module - <<'JS'
          const query='query($buildId:ID!){builds{byId(buildId:$buildId){id status error{errorCode message} logFiles}}}';
          const response=await fetch('https://api.expo.dev/graphql',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+process.env.EXPO_TOKEN,'user-agent':'eas-cli/22.5.0'},body:JSON.stringify({query,variables:{buildId:'c090c4d1-4244-436f-8a70-ec1ee33a51a9'}})});
          const result=await response.json();
          if(result.errors) throw new Error('Unable to read build diagnostic');
          const build=result.data.builds.byId;
          console.log(JSON.stringify({id:build.id,status:build.status,error:build.error}));
          for(const url of build.logFiles){
            const log=await (await fetch(url)).text();
            let context=0;
            for(const line of log.split('\n')){
              let message=line;
              try { const entry=JSON.parse(line); message=entry.msg ?? entry.message ?? ''; } catch {}
              if(/(?:^e:|Unresolved reference|A problem occurred|Plugin .*not found|Could not compile|Execution failed|Compilation error|FAILURE:)/i.test(message)){
                context=7;
              }
              if(context>0){
                console.log(message.replace(/https?:\/\/\S+/g,'[URL]').slice(0,2500));
                context--;
              }
            }
          }
          JS
