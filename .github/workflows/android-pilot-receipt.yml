name: Android pilot native receipt
on:
  push:
    branches: ['codex/pilote-abidjan-20261204']
    paths: ['.github/workflows/android-pilot-receipt.yml', 'scripts/pilot-android-qa/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  checks: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      GH_TOKEN: ${{ github.token }}
      EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_spawt_abidjan_local_recette
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare isolated fixture and Metro
        run: |
          git diff --exit-code ff4864e76e84f8448d102ed35bfb48684b347b94 -- app supabase
          bash scripts/pilot-android-qa/start-ci.sh "$GITHUB_WORKSPACE"
          npm ci --prefix app --legacy-peer-deps --no-audit --no-fund
          cd app
          CI=1 nohup npx expo start --localhost --port 8081 --offline --no-dev --minify > "$RUNNER_TEMP/pilot-metro.log" 2>&1 &
      - name: Start Android 15
        run: |
          sudo chmod 666 /dev/kvm
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64' >/dev/null
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n pilot -k 'system-images;android-35;google_apis;x86_64' --device pixel_5 --force
          nohup "$ANDROID_HOME/emulator/emulator" -avd pilot -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu software -memory 3072 -cores 2 > "$RUNNER_TEMP/pilot-emulator.log" 2>&1 &
          timeout 180s "$ANDROID_HOME/platform-tools/adb" wait-for-device
          for i in {1..90}; do if [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi; sleep 2; done
          "$ANDROID_HOME/platform-tools/adb" shell input keyevent 82
      - name: Receive pinned binaries
        run: |
          mkdir -p pilot-proof
          gh run watch 45672864305 --interval 30 --exit-status
          gh run download 45672864305 -n android-apk -D "$RUNNER_TEMP/pilot-signed"
          gh run watch 45673678941 --interval 30 --exit-status
          gh run download 45673678941 -n emulator-debug-43-x86_64 -D "$RUNNER_TEMP/pilot-debug"
          debug=$(find "$RUNNER_TEMP/pilot-debug" -name app-debug.apk)
          test -n "$debug" && echo "PILOT_DEBUG_APK=$debug" >> "$GITHUB_ENV"
      - name: Verify signed upgrade, domain and HTTPS intents
        run: |
          curl --retry 2 -fsSL 'https://github.com/xtincell/spawt-ci-mobile-v1-mvp/releases/download/local-build-android-2026-10-30-42/spawt-1.1.1-build42.apk' -o "$RUNNER_TEMP/previous.apk"
          echo "2fba5164863e446c8a4087c48954e67a790073865c9cd94c31a3a9a9003160f7  $RUNNER_TEMP/previous.apk" | sha256sum -c -
          adb install "$RUNNER_TEMP/previous.apk"
          adb shell dumpsys package com.upgraders.spawt | grep -E 'versionCode=|versionName=|[fF]irstInstallTime|lastUpdateTime' > pilot-proof/signed-upgrade.txt
          sleep 2
          adb install -r "$RUNNER_TEMP/pilot-signed/spawt-1.1.2-build43.apk"
          adb shell dumpsys package com.upgraders.spawt | grep -E 'versionCode=|versionName=|[fF]irstInstallTime|lastUpdateTime' >> pilot-proof/signed-upgrade.txt
          grep -q 'versionCode=42 ' pilot-proof/signed-upgrade.txt && grep -q 'versionCode=43 ' pilot-proof/signed-upgrade.txt
          adb shell pm verify-app-links --re-verify com.upgraders.spawt
          for i in {1..45}; do adb shell pm get-app-links com.upgraders.spawt > pilot-proof/verified-links.txt; grep -q 'spawt.online: verified' pilot-proof/verified-links.txt && break; sleep 2; done
          if ! grep -q 'spawt.online: verified' pilot-proof/verified-links.txt; then echo "Domaine non vérifié par Android dans le délai du runner" >> pilot-proof/verified-links.txt; fi
          adb shell am force-stop com.upgraders.spawt
          link=https://spawt.online/reprendre/00000000-0000-4000-8000-000000000001
          for state in cold warm; do
            adb shell am start -W -a android.intent.action.VIEW -c android.intent.category.BROWSABLE -d "$link" > "pilot-proof/signed-$state.txt"
            sleep 12
          done
      - name: Run consent, account, view and confirmed favorite in local fixture
        if: ${{ !cancelled() && env.PILOT_DEBUG_APK != '' }}
        run: |
          adb shell wm size 1080x2160
          adb shell wm density 420
          adb shell settings put system show_touches 1
          adb reverse tcp:54321 tcp:54321
          adb reverse tcp:8081 tcp:8081
          curl -fsS http://127.0.0.1:8081/status
          python3 scripts/pilot-android-qa/native.py
      - name: Export local server receipts
        if: ${{ !cancelled() && env.PILOT_DB_CONTAINER != '' }}
        run: |
          mkdir -p pilot-proof
          docker exec -i "$PILOT_DB_CONTAINER" psql -X -q -U postgres -d pilot_http < scripts/pilot-android-qa/trace.sql > pilot-proof/trace-serveur.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-native-receipt
          path: pilot-proof
          retention-days: 14
