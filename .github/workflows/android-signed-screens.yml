name: Android signed screen inspection
on:
  push:
    branches: ['codex/recette-signee-47']
    paths: ['.github/workflows/android-signed-screens.yml', 'scripts/android-signed-47.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    env:
      ANDROID_USER_HOME: /tmp/spawt-pilot-android
      ANDROID_AVD_HOME: /tmp/spawt-pilot-android/avd
      ADB_VENDOR_KEYS: /tmp/spawt-pilot-android/adbkey
    steps:
      - uses: actions/checkout@v4
      - name: Start Android 15
        run: |
          sudo chmod 666 /dev/kvm
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator' 'system-images;android-35;google_apis_playstore;x86_64' >/dev/null
          df -h .
          mkdir -p "$ANDROID_AVD_HOME"
          mkdir -p "$HOME/.android"
          "$ANDROID_HOME/platform-tools/adb" keygen "$ANDROID_USER_HOME/adbkey" >/dev/null
          install -m 600 "$ANDROID_USER_HOME/adbkey" "$HOME/.android/adbkey"
          install -m 644 "$ANDROID_USER_HOME/adbkey.pub" "$HOME/.android/adbkey.pub"
          "$ANDROID_HOME/platform-tools/adb" start-server
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n pilot -k 'system-images;android-35;google_apis_playstore;x86_64' --device pixel_5 --path "$ANDROID_AVD_HOME/pilot.avd" --force
          test -s "$ANDROID_AVD_HOME/pilot.ini"
          echo "disk.dataPartition.size=2048M" >> "$ANDROID_AVD_HOME/pilot.avd/config.ini"
          nohup "$ANDROID_HOME/emulator/emulator" -avd pilot -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu software -memory 3072 -cores 2 > "$RUNNER_TEMP/pilot-emulator.log" 2>&1 &
          emulator_pid=$!
          sleep 5
          tail -c 7000 "$RUNNER_TEMP/pilot-emulator.log"
          kill -0 "$emulator_pid"
          if ! timeout 240s "$ANDROID_HOME/platform-tools/adb" wait-for-device; then tail -c 12000 "$RUNNER_TEMP/pilot-emulator.log"; exit 1; fi
          for i in {1..90}; do if [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi; sleep 2; done
          "$ANDROID_HOME/platform-tools/adb" shell input keyevent 82
      - name: Recevoir et comparer les APK signés 45 et 47
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 45824861462 --name android-apk --dir "$RUNNER_TEMP/signed"
          apk="$RUNNER_TEMP/signed/spawt-1.1.6-build47.apk"
          legacy="$RUNNER_TEMP/spawt-1.1.4-build45.apk"
          curl -fsSL --retry 3 'https://spawt.online/downloads/spawt-1.1.4-build45.apk' -o "$legacy"
          echo "b6a092e3935835de1f6a0b6384c953d96b0f37ed15eaeb5ba842527a95e63a90  $legacy" | sha256sum -c -
          echo "88042ac19e7c6d3af6626f761f25eab45bbe3d212651af05f0a8ab1e66214129  $apk" | sha256sum -c -
          test "$(stat -c %s "$apk")" = 162897383
          test "$(stat -c %s "$legacy")" = 162850779
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify --print-certs-pem "$legacy" > "$RUNNER_TEMP/signer45"
          "$signer" verify --print-certs-pem "$apk" > "$RUNNER_TEMP/signer47"
          sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' "$RUNNER_TEMP/signer45" > "$RUNNER_TEMP/cert45"
          sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' "$RUNNER_TEMP/signer47" > "$RUNNER_TEMP/cert47"
          openssl x509 -in "$RUNNER_TEMP/cert45" -noout -fingerprint -sha256
          openssl x509 -in "$RUNNER_TEMP/cert47" -noout -fingerprint -sha256
          cmp "$RUNNER_TEMP/cert45" "$RUNNER_TEMP/cert47"
          echo "PILOT_DEBUG_APK=$apk" >> "$GITHUB_ENV"
          echo "PILOT_LEGACY_APK=$legacy" >> "$GITHUB_ENV"
      - name: Mise à jour, premier écran, fiche et favori acquitté
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/android-signed-47.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recette-signee-47
          path: |
            ui-review/recu.json
            ui-review/onboarding-propre.png
            ui-review/mes-envies.png
            ui-review/mes-envies-adresse.png
          retention-days: 14
