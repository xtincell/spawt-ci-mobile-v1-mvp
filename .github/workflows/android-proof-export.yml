name: Export native receipt for inspection
on:
  push:
    tags: ['export-android-proof-*']
permissions:
  contents: write
  actions: read
concurrency:
  group: android-receipt-export
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/export-native-proof.mjs
        env:
          GH_TOKEN: ${{ github.token }}
