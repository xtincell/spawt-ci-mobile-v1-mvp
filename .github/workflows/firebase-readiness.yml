name: Firebase and Expo readiness metadata
on:
  push:
    tags: ['audit-firebase-*']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read SPAWT Firebase metadata in Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: node scripts/audit-firebase-readiness.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: firebase-readiness
          path: firebase-proof/expo-firebase-readiness.json
          retention-days: 14
