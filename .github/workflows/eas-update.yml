name: EAS Update (OTA preview)

# Pousse un update OTA (JS uniquement, pas de rebuild natif) sur le channel
# `preview` depuis un runner GitHub — upstream datacenter rapide, contourne la
# contrainte de débit montant local (cf. retro : push EAS bloqué à ~1-23 KB/s
# côté Abidjan). Déclenchement MANUEL volontaire : on ne pousse aux testeurs
# qu'après sign-off, jamais automatiquement à chaque commit.
#
# Pré-requis (one-time, côté repo GitHub) :
#   Settings > Secrets and variables > Actions > New repository secret
#     EXPO_TOKEN = <token expo.dev/accounts/xtincell/settings/access-tokens>
#
# Le projet Expo est lié via app/app.json extra.eas.projectId — pas besoin de
# le repréciser ici.

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Message de l'update OTA (visible dans le dashboard Expo)"
        required: true
        default: "OTA preview update"
      platform:
        description: "Plateforme cible"
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - all

concurrency:
  # Un seul update preview à la fois — évite deux publish concurrents sur la
  # même branche qui se marcheraient dessus.
  group: eas-update-preview
  cancel-in-progress: false

jobs:
  update:
    name: Publish OTA update
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 22 (LTS) et non 20 : `eas-version: latest` a fini par
          # résoudre eas-cli 22.5.0, dont une dépendance
          # (@oclif/plugin-autocomplete) exige Node >= 22. Le build échouait
          # alors AVANT toute compilation, sur l'installation de l'outil —
          # sans que rien n'ait changé dans le dépôt. C'est la contrepartie de
          # `latest` : l'environnement dérive tout seul.
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        # --legacy-peer-deps : React 19 + jest-expo génèrent des warnings
        # peer-deps cosmétiques (cf. project-context.md).
        run: npm ci --legacy-peer-deps

      # ── Triple gate (garde-fou bloquant avant tout OTA aux testeurs) ──────
      # Aligné sur la convention projet : tsc + lint:vocab + i18n:check en série.
      # Un seul KO bloque le publish — on ne pousse jamais de code cassé en alpha.
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Vocab audit (lint:vocab)
        run: npm run lint:vocab

      - name: i18n check
        run: npm run i18n:check

      - name: Tests (jest)
        run: npm test -- --ci

      # ── Auth EAS + publish ────────────────────────────────────────────────
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Épingler le backend de la distribution preview dans le manifeste
        run: |
          node ../scripts/pin-backend-in-manifest.mjs preview
          npx expo config --type public --json > "$RUNNER_TEMP/config-export-ota.json"
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const config=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/config-export-ota.json'));
          const profile=JSON.parse(fs.readFileSync('eas.json')).build.preview;
          const extra=config.extra || {};
          if(extra.supabaseUrl!=='https://api.spawt.online' || !extra.supabaseAnonKey || extra.supabaseAnonKey!==profile.env.EXPO_PUBLIC_SUPABASE_ANON_KEY
            || config.updates?.enabled!==true || config.runtimeVersion?.policy!=='nativeVersion'
            || config.updates.url!=='https://u.expo.dev/'+extra.eas.projectId || profile.channel!=='preview') throw new Error('Configuration OTA non conforme au profil APK');
          const proof={api:extra.supabaseUrl,keySha256:createHash('sha256').update(extra.supabaseAnonKey).digest('hex'),project:extra.eas.projectId,
            androidRuntime:config.version+'('+config.android.versionCode+')',channel:profile.channel,source:process.env.GITHUB_SHA};
          console.log(JSON.stringify(proof));
          fs.writeFileSync(process.env.RUNNER_TEMP+'/ota-config-recue.json',JSON.stringify(proof,null,2));
          JS
      - name: Publish OTA update
        env:
          SPAWT_OTA_MESSAGE: ${{ inputs.message }}
          SPAWT_OTA_PLATFORM: ${{ inputs.platform }}
        run: >-
          eas update
          --branch preview
          --environment preview
          --platform "$SPAWT_OTA_PLATFORM"
          --message "$SPAWT_OTA_MESSAGE"
          --non-interactive --json > "$RUNNER_TEMP/ota-publiee.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ota-publiee
          path: |
            ${{ runner.temp }}/ota-publiee.json
            ${{ runner.temp }}/ota-config-recue.json
