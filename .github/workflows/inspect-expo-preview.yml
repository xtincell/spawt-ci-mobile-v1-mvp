name: Lire le canal Expo Android
on:
  push:
    branches: [codex/lecture-canal-expo48]
    paths: [.github/workflows/inspect-expo-preview.yml]
permissions:
  contents: read
jobs:
  mapping:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --legacy-peer-deps --no-audit
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Lire le canal, sa branche et le runtime Android
        run: |
          eas channel:view preview --json --non-interactive > "$RUNNER_TEMP/channel.json"
          eas branch:view preview --json --non-interactive > "$RUNNER_TEMP/branch.json"
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const temp=process.env.RUNNER_TEMP;
          const channel=JSON.parse(fs.readFileSync(temp+'/channel.json','utf8')).currentPage;
          const branch=JSON.parse(fs.readFileSync(temp+'/branch.json','utf8'));
          console.log('Channel fields:',Object.keys(channel),'Branch fields:',Object.keys(branch));
          const mapping=typeof channel.branchMapping==='string'?JSON.parse(channel.branchMapping):channel.branchMapping;
          const entries=mapping?.data || [];
          const mapped=entries.find(x=>x.branchId===branch.id);
          const expo=JSON.parse(fs.readFileSync('app.json')).expo;
          const record={project:expo.extra.eas.projectId,channel:channel.name,branch:branch.name,matchedBranch:Boolean(mapped),isPaused:channel.isPaused,
            route:entries.map(e=>({branchId:e.branchId,logic:e.branchMappingLogic})),runtime:expo.version+'('+expo.android.versionCode+')',
            receivedAt:new Date().toISOString(),source:process.env.GITHUB_SHA,noUpdatePublished:true};
          console.log(JSON.stringify(record));
          fs.writeFileSync(temp+'/expo-canal.json',JSON.stringify(record,null,2));
          if(channel.name!=='preview'||branch.name!=='preview'||!mapped||channel.isPaused===true||mapped.branchMappingLogic!=='true')throw new Error('Le raccordement doit être vérifié');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expo-channel-read
          path: ${{ runner.temp }}/expo-canal.json
