name: Fiche publique sur APK signé après OTA
on:
  push:
    branches: ['codex/fiche-android-ota48']
    paths: ['documentation/android-place-ota-proof.json']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    env:
      ANDROID_USER_HOME: /tmp/spawt-pilot-android
      ANDROID_AVD_HOME: /tmp/spawt-pilot-android/avd
      ADB_VENDOR_KEYS: /tmp/spawt-pilot-android/adbkey
    steps:
      - uses: actions/checkout@v4
      - name: Start Android 15
        run: |
          sudo chmod 666 /dev/kvm
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator' 'system-images;android-35;google_apis_playstore;x86_64' >/dev/null
          df -h .
          mkdir -p "$ANDROID_AVD_HOME"
          mkdir -p "$HOME/.android"
          "$ANDROID_HOME/platform-tools/adb" keygen "$ANDROID_USER_HOME/adbkey" >/dev/null
          install -m 600 "$ANDROID_USER_HOME/adbkey" "$HOME/.android/adbkey"
          install -m 644 "$ANDROID_USER_HOME/adbkey.pub" "$HOME/.android/adbkey.pub"
          "$ANDROID_HOME/platform-tools/adb" start-server
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n pilot -k 'system-images;android-35;google_apis_playstore;x86_64' --device pixel_5 --path "$ANDROID_AVD_HOME/pilot.avd" --force
          test -s "$ANDROID_AVD_HOME/pilot.ini"
          echo "disk.dataPartition.size=2048M" >> "$ANDROID_AVD_HOME/pilot.avd/config.ini"
          nohup "$ANDROID_HOME/emulator/emulator" -avd pilot -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu software -memory 3072 -cores 2 > "$RUNNER_TEMP/pilot-emulator.log" 2>&1 &
          emulator_pid=$!
          sleep 5
          tail -c 7000 "$RUNNER_TEMP/pilot-emulator.log"
          kill -0 "$emulator_pid"
          if ! timeout 240s "$ANDROID_HOME/platform-tools/adb" wait-for-device; then tail -c 12000 "$RUNNER_TEMP/pilot-emulator.log"; exit 1; fi
          for i in {1..90}; do if [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi; sleep 2; done
          "$ANDROID_HOME/platform-tools/adb" shell input keyevent 82
      - name: Recevoir le fichier public du 48 et ouvrir la nouvelle fiche dans Android
        env:
          GH_TOKEN: ${{ github.token }}
          PILOT_DEBUG_APK: /tmp/spawt-fiche-public48.apk
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const config=JSON.parse(fs.readFileSync('documentation/android-place-ota-proof.json'));
          const manifest=await (await fetch('https://raw.githubusercontent.com/xtincell/spawt-ci-mobile-v1-mvp/android-releases/latest.json?run='+process.env.GITHUB_RUN_ID)).json();
          if(config.build!==48 || manifest.build!==48 || manifest.sha256!==config.sha256) throw new Error('Le canal doit pointer vers le 48 validé');
          const response=await fetch('https://spawt.online/downloads/spawt-1.1.7-build48.apk');
          if(!response.ok) throw new Error('Téléchargement vitrine HTTP '+response.status);
          const bytes=Buffer.from(await response.arrayBuffer());
          if(bytes.length!==manifest.bytes || createHash('sha256').update(bytes).digest('hex')!==config.sha256) throw new Error('La vitrine et le canal doivent servir le même binaire');
          fs.writeFileSync(process.env.PILOT_DEBUG_APK,bytes);
          JS
          adb install "$PILOT_DEBUG_APK"
          adb shell pm grant com.upgraders.spawt android.permission.POST_NOTIFICATIONS
          python3 -m pip install --quiet pillow
          python3 scripts/android-place-ota-proof.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fiche-publique-android-48
          path: fiche-ota
          retention-days: 14
