name: Qualité visuelle Android
on:
  push:
    branches: ['codex/pilote-abidjan-20261204']
    paths: ['.github/workflows/android-ui-review.yml', 'scripts/android-ui-review.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  checks: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_spawt_abidjan_local_recette
      EXPO_NO_TELEMETRY: 1
      ANDROID_USER_HOME: /tmp/spawt-pilot-android
      ANDROID_AVD_HOME: /tmp/spawt-pilot-android/avd
      ADB_VENDOR_KEYS: /tmp/spawt-pilot-android/adbkey
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare isolated fixture and Metro
        run: |
          bash scripts/pilot-android-qa/start-ci.sh "$GITHUB_WORKSPACE"
          npm ci --prefix app --legacy-peer-deps --no-audit --no-fund
          cd app
          # Match the signed build's UI. The developer-only warning banner covers the bottom buttons in debug clients.
          printf '%s\n' 'import { LogBox } from "react-native"; LogBox.ignoreAllLogs();' > qa-quiet.js
          sed -i '1i import "./qa-quiet";' index.js
          CI=1 EXPO_OFFLINE=1 NODE_OPTIONS=--dns-result-order=ipv4first nohup npx expo start --lan --port 8081 --no-dev --minify > "$RUNNER_TEMP/pilot-metro.log" 2>&1 &
          for i in {1..60}; do if curl -fsS http://127.0.0.1:8081/status >/dev/null 2>&1; then break; fi; sleep 2; done
          if ! curl -fsS http://127.0.0.1:8081/status; then ss -lnt; tail -60 "$RUNNER_TEMP/pilot-metro.log"; exit 1; fi
      - name: Load the public map inventory into the isolated database
        run: node scripts/pilot-android-qa/seed-carte.mjs | docker exec -i "$PILOT_DB_CONTAINER" psql -X -q -v ON_ERROR_STOP=1 -U postgres -d pilot_http
      - name: Start Android 15
        run: |
          sudo chmod 666 /dev/kvm
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator' 'system-images;android-35;google_apis_playstore;x86_64' >/dev/null
          df -h .
          mkdir -p "$ANDROID_AVD_HOME"
          mkdir -p "$HOME/.android"
          "$ANDROID_HOME/platform-tools/adb" keygen "$ANDROID_USER_HOME/adbkey" >/dev/null
          install -m 600 "$ANDROID_USER_HOME/adbkey" "$HOME/.android/adbkey"
          install -m 644 "$ANDROID_USER_HOME/adbkey.pub" "$HOME/.android/adbkey.pub"
          "$ANDROID_HOME/platform-tools/adb" start-server
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n pilot -k 'system-images;android-35;google_apis_playstore;x86_64' --device pixel_5 --path "$ANDROID_AVD_HOME/pilot.avd" --force
          test -s "$ANDROID_AVD_HOME/pilot.ini"
          echo "disk.dataPartition.size=2048M" >> "$ANDROID_AVD_HOME/pilot.avd/config.ini"
          nohup "$ANDROID_HOME/emulator/emulator" -avd pilot -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu software -memory 3072 -cores 2 > "$RUNNER_TEMP/pilot-emulator.log" 2>&1 &
          emulator_pid=$!
          sleep 5
          tail -c 7000 "$RUNNER_TEMP/pilot-emulator.log"
          kill -0 "$emulator_pid"
          if ! timeout 240s "$ANDROID_HOME/platform-tools/adb" wait-for-device; then tail -c 12000 "$RUNNER_TEMP/pilot-emulator.log"; exit 1; fi
          for i in {1..90}; do if [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi; sleep 2; done
          "$ANDROID_HOME/platform-tools/adb" shell input keyevent 82
      - name: Photographier les écrans après les gestes Android
        run: |
          gh run download 45708837139 -n emulator-debug-45-x86_64 -D "$RUNNER_TEMP/debug"
          export PILOT_DEBUG_APK="$(find "$RUNNER_TEMP/debug" -name app-debug.apk)"
          adb reverse tcp:8081 tcp:8081
          adb reverse tcp:54321 tcp:54321
          adb install "$PILOT_DEBUG_APK"
          adb shell pm grant com.upgraders.spawt android.permission.POST_NOTIFICATIONS
          python3 scripts/android-ui-review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trois-ecrans-android
          path: ui-review
          retention-days: 14
