name: Publish verified Android APK
on:
  push:
    tags: ['publish-android-*']
permissions:
  contents: write
  actions: read
concurrency:
  group: android-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the public download channel rules
        run: node --test scripts/__tests__/publish-android-channel.test.mjs
      - name: Validate pinned build and native QA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const c=JSON.parse(fs.readFileSync('documentation/android-release.json'));
          if(!Number.isSafeInteger(c.build) || !/^[a-f0-9]{64}$/.test(c.sha256) || !/^[a-f0-9]{40}$/.test(c.sourceCommit) || c.tag!==`local-build-android-${c.buildDate}-${c.build}` || !Number.isSafeInteger(c.bytes)) throw new Error('Invalid release recipe');
          const tag=execFileSync('git',['rev-parse',c.tag+'^{commit}'],{encoding:'utf8'}).trim();
          if(tag!==c.buildWorkflowCommit) throw new Error('Release tag changed');
          for(const [id,sha,path] of [[c.buildRun,c.buildWorkflowCommit,'.github/workflows/android-local-build.yml'],[c.qaRun,c.qaWorkflowCommit,'.github/workflows/android-qa.yml']]) {
            const r=JSON.parse(execFileSync('gh',['api',`repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${id}`],{encoding:'utf8'}));
            if(r.status!=='completed' || r.conclusion!=='success' || r.head_sha!==sha || r.path!==path) throw new Error('Required verified run is missing');
          }
          execFileSync('gh',['run','download',String(c.buildRun),'--repo',process.env.GITHUB_REPOSITORY,'--name','android-apk','--dir','release-apk'],{stdio:'inherit'});
          execFileSync('gh',['run','download',String(c.qaRun),'--repo',process.env.GITHUB_REPOSITORY,'--name','android-proof','--dir','native-proof'],{stdio:'inherit'});
          JS
      - name: Verify received artifacts and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const c=JSON.parse(fs.readFileSync('documentation/android-release.json'));
          const m=JSON.parse(fs.readFileSync('release-apk/apk-metadata.json'));
          const q=JSON.parse(fs.readFileSync('native-proof/apk-metadata.json'));
          const assertions=JSON.parse(fs.readFileSync('native-proof/assertions.json'));
          const opening=JSON.parse(fs.readFileSync('native-proof/opening-visibility.json'));
          const firebase=JSON.parse(fs.readFileSync('native-proof/firebase-runtime.json'));
          if(m.sourceCommit!==c.sourceCommit || m.version!==c.version || m.build!==c.build || m.runId!==c.buildRun || m.sha256!==c.sha256 || m.bytes!==c.bytes || q.sha256!==m.sha256 || assertions.length<5 || !assertions.every(a=>a.passed===true) || opening.passed!==true) throw new Error('Release proof mismatch');
          if(!['signatureMatchesBuild25','zipCrcPassed','nativePackageVerified','compiledBackendConfigVerified','compiledFirebaseConfigVerified'].every(k=>m[k]===true)) throw new Error('APK checks incomplete');
          if(firebase.defaultAppInitialized!==true) throw new Error('Firebase native initialization was not verified');
          if(c.build>=37) {
            const live=JSON.parse(fs.readFileSync('native-proof/live-data.json'));
            if(live.build!==c.build || live.apiOrigin!=='https://api.spawt.online' || !['nativeAuthenticated','announcementsRead','editorialTextMatched','collectionRead','fiveContentChecksPassed','offlineFailureAndRecovery','feedbackReceiptReceived','feedbackReplyRead','personalExplorationChecked','unratedDocumentaryRead'].every(key=>live[key]===true)) throw new Error('Live native database and feedback proof missing');
            if(c.build>=39 && !['nativeMenuPhotoReceivedAndModerated','contributionReceiptReceived','contributionModerationRead','contributionRewardRead','contributionDidNotCreateVisit'].every(key=>live[key]===true)) throw new Error('Native contribution and moderation proof missing');
            fs.copyFileSync('native-proof/live-data.json','release-apk/live-data-proof.json');
            fs.copyFileSync('native-proof/live-home-393-1.png','release-apk/home-native.png');
            fs.copyFileSync('native-proof/live-content-checks.png','release-apk/content-checks-native.png');
          }
          const name=`spawt-${c.version}-build${c.build}.apk`,path='release-apk/'+name;
          const apk=fs.readFileSync(path);
          if(apk.length!==c.bytes || crypto.createHash('sha256').update(apk).digest('hex')!==c.sha256) throw new Error('APK bytes differ');
          fs.writeFileSync(path+'.sha256',c.sha256+'  '+name+'\n');
          const gh=args=>execFileSync('gh',args.concat(['--repo',process.env.GITHUB_REPOSITORY]),{encoding:'utf8'});
          const existing=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/releases/tags/${c.tag}`,{headers:{accept:'application/vnd.github+json',authorization:'Bearer '+process.env.GH_TOKEN},signal:AbortSignal.timeout(30000)});
          if(existing.status===404) {
            gh(['release','create',c.tag,'--draft','--prerelease','--verify-tag','--title',`SPAWT Android ${c.version} — build ${c.build}`,'--notes-file',`documentation/android-build${c.build}-release-notes.md`]);
          }else if(!existing.ok) throw new Error('Release lookup HTTP '+existing.status);
          const release=JSON.parse(gh(['release','view',c.tag,'--json','isDraft,assets']));
          if(release.isDraft) {
            if(release.assets.length) throw new Error('Draft release has partial assets; inspect before retrying');
            gh(['release','upload',c.tag,path,'release-apk/apk-metadata.json',path+'.sha256',...(c.build>=37 ? ['release-apk/live-data-proof.json','release-apk/home-native.png','release-apk/content-checks-native.png'] : [])]);
            gh(['release','edit',c.tag,'--draft=false','--prerelease','--latest=false','--title',`SPAWT Android ${c.version} — build ${c.build}`,'--notes-file',`documentation/android-build${c.build}-release-notes.md`]);
          }
          console.log('Release assets ready for final verification: build '+c.build);
          JS
      - name: Advance the official website download channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-android-channel.mjs
