name: Publish verified Android APK
on:
  push:
    tags: ['publish-android-*']
    branches: ['codex/build42-raccordements', 'codex/pilote-abidjan-20261204', 'codex/deploiement-release-47']
    paths: ['documentation/android-release.json', '.github/workflows/android-release.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: android-publication
  cancel-in-progress: false
jobs:
  publish:
    if: "(github.ref != 'refs/heads/codex/deploiement-release-47' || github.event.head_commit.message == 'release: publish verified Android build 47') && (github.ref != 'refs/heads/codex/build42-raccordements' || github.event.head_commit.message == 'release: publish verified Android build 42') && (github.ref != 'refs/heads/codex/pilote-abidjan-20261204' || (github.event.head_commit.message == 'release: publish verified Android build 45' || github.event.head_commit.message == 'release: publish verified Android build 46' || github.event.head_commit.message == 'release: publish verified Android build 48'))"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref == 'refs/heads/codex/deploiement-release-47' && '37a3ba8770c0979430fe1abe08a1e4a9db1c11a7' || github.sha }}
      - name: Vérifier le commit de publication qualifié du build 47
        if: github.ref == 'refs/heads/codex/deploiement-release-47'
        run: test "$(git rev-parse HEAD)" = '37a3ba8770c0979430fe1abe08a1e4a9db1c11a7'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the public download channel rules
        run: node --test scripts/__tests__/publish-android-channel.test.mjs scripts/__tests__/validate-android-release.test.mjs scripts/__tests__/pilot45-receipt.test.mjs scripts/__tests__/ui46-receipt.test.mjs scripts/__tests__/pilot47-receipt.test.mjs
      - name: Validate pinned build and native QA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {androidPublicationProfile} from './scripts/validate-android-release.mjs';
          const c=JSON.parse(fs.readFileSync('documentation/android-release.json'));
          if (process.env.GITHUB_REF === 'refs/heads/codex/pilote-abidjan-20261204') {
            const event=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH));
            if (event.head_commit.message !== `release: publish verified Android build ${c.build}`) throw new Error('Build number differs from the publication request');
          }
          if(!Number.isSafeInteger(c.build) || !/^[a-f0-9]{64}$/.test(c.sha256) || !/^[a-f0-9]{40}$/.test(c.sourceCommit) || c.tag!==`local-build-android-${c.buildDate}-${c.build}` || !Number.isSafeInteger(c.bytes)) throw new Error('Invalid release recipe');
          const profile=androidPublicationProfile(c);
          if(profile==='dish48-alpha') execFileSync('node',['--test','scripts/__tests__/validate-dish48.test.mjs'],{stdio:'inherit'});
          const required=[[c.buildRun,c.buildWorkflowCommit,'.github/workflows/android-local-build.yml','success'],[c.qaRun,c.qaWorkflowCommit,'.github/workflows/android-qa.yml','success']];
          if(profile==='pilot45-alpha') required.push([c.pilotRun,c.pilotWorkflowCommit,'.github/workflows/android-pilot-receipt.yml','failure'],[c.liveRun,c.liveWorkflowCommit,'.github/workflows/android-qa.yml','failure']);
          if(profile==='pilot47-signed') required.push([c.uiRun,c.uiWorkflowCommit,'.github/workflows/android-signed-screens.yml','success']);
          if(profile==='ui46-alpha') required.push([c.uiRun,c.uiWorkflowCommit,'.github/workflows/android-signed-screens.yml','success']);
          for(const [id,sha,path,conclusion] of required) {
            const r=JSON.parse(execFileSync('gh',['api',`repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${id}`],{encoding:'utf8'}));
            if(r.status!=='completed' || r.conclusion!==conclusion || r.head_sha!==sha || r.path!==path) throw new Error('Required verified run is missing');
          }
          // Create the provenance tag only after both pinned runs succeeded.
          // The workflow token suppresses a second build triggered by this tag.
          // Existing tags remain immutable, including on publication retries.
          let tag;
          try { tag=execFileSync('git',['rev-parse','--verify',c.tag+'^{commit}'],{encoding:'utf8',stdio:['ignore','pipe','ignore']}).trim(); }
          catch {
            execFileSync('git',['tag',c.tag,c.buildWorkflowCommit],{stdio:'inherit'});
            execFileSync('git',['push','origin',`refs/tags/${c.tag}`],{stdio:'inherit'});
            tag=execFileSync('git',['rev-parse',c.tag+'^{commit}'],{encoding:'utf8'}).trim();
          }
          if(tag!==c.buildWorkflowCommit) throw new Error('Release tag changed');
          execFileSync('gh',['run','download',String(c.buildRun),'--repo',process.env.GITHUB_REPOSITORY,'--name','android-apk','--dir','release-apk'],{stdio:'inherit'});
          execFileSync('gh',['run','download',String(c.qaRun),'--repo',process.env.GITHUB_REPOSITORY,'--name','android-proof','--dir','native-proof'],{stdio:'inherit'});
          if(profile==='pilot47-signed') {
            execFileSync('git',['diff','--exit-code',c.sourceCommit,c.uiWorkflowCommit,'--','app']);
            execFileSync('gh',['run','download',String(c.uiRun),'--repo',process.env.GITHUB_REPOSITORY,'--name','recette-signee-47','--dir','ui-native-proof'],{stdio:'inherit'});
          }
          if(profile==='ui46-alpha') {
            execFileSync('git',['diff','--exit-code',c.sourceCommit,c.uiWorkflowCommit,'--','app']);
            execFileSync('gh',['run','download',String(c.uiRun),'--repo',process.env.GITHUB_REPOSITORY,'--name','trois-ecrans-android','--dir','ui-native-proof'],{stdio:'inherit'});
          }
          if(profile==='pilot45-alpha') {
            execFileSync('gh',['run','download',String(c.pilotRun),'--repo',process.env.GITHUB_REPOSITORY,'--name','pilot-native-receipt','--dir','pilot-native-proof'],{stdio:'inherit'});
            execFileSync('gh',['run','download',String(c.liveRun),'--repo',process.env.GITHUB_REPOSITORY,'--name','android-proof','--dir','partial-live-proof'],{stdio:'inherit'});
          }
          JS
      - name: Verify received artifacts and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {prepareAndroidReleaseProof} from './scripts/validate-android-release.mjs';
          const c=JSON.parse(fs.readFileSync('documentation/android-release.json'));
          const evidence=prepareAndroidReleaseProof(c);
          const name=`spawt-${c.version}-build${c.build}.apk`,path='release-apk/'+name;
          const apk=fs.readFileSync(path);
          if(apk.length!==c.bytes || crypto.createHash('sha256').update(apk).digest('hex')!==c.sha256) throw new Error('APK bytes differ');
          fs.writeFileSync(path+'.sha256',c.sha256+'  '+name+'\n');
          const gh=args=>execFileSync('gh',args.concat(['--repo',process.env.GITHUB_REPOSITORY]),{encoding:'utf8'});
          const existing=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/releases/tags/${c.tag}`,{headers:{accept:'application/vnd.github+json',authorization:'Bearer '+process.env.GH_TOKEN},signal:AbortSignal.timeout(30000)});
          if(existing.status===404) {
            gh(['release','create',c.tag,'--draft','--prerelease','--verify-tag','--title',`SPAWT Android ${c.version} — build ${c.build}`,'--notes-file',`documentation/android-build${c.build}-release-notes.md`]);
          }else if(!existing.ok) throw new Error('Release lookup HTTP '+existing.status);
          const release=JSON.parse(gh(['release','view',c.tag,'--json','isDraft,assets']));
          if(release.isDraft) {
            if(release.assets.length) throw new Error('Draft release has partial assets; inspect before retrying');
            gh(['release','upload',c.tag,path,'release-apk/apk-metadata.json',path+'.sha256',...evidence.assets]);
            gh(['release','edit',c.tag,'--draft=false','--prerelease','--latest=false','--title',`SPAWT Android ${c.version} — build ${c.build}`,'--notes-file',`documentation/android-build${c.build}-release-notes.md`]);
          }
          console.log('Release assets ready for final verification: build '+c.build);
          JS
      - name: Advance the official website download channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-android-channel.mjs
