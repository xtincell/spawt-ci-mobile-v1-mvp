name: EAS cancel intermediate build 21
on:
  push:
    tags: ['cleanup-eas-2026-10-09-21']
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 22.5.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Lire et arrêter uniquement la compilation intermédiaire remplacée
        working-directory: app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          node --input-type=module - <<'JS'
          import {execFileSync} from 'node:child_process';
          const query='query($appId:String!){app{byId(appId:$appId){builds(offset:0,limit:8){id status platform appBuildVersion gitCommitHash}}}}';
          const read=async()=>{
            const response=await fetch('https://api.expo.dev/graphql',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+process.env.EXPO_TOKEN},body:JSON.stringify({query,variables:{appId:'15ac2301-e901-4caa-a8c8-864c6621bcd0'}})});
            const result=await response.json();
            if(!response.ok || result.errors) throw new Error(JSON.stringify(result.errors ?? {status:response.status}));
            return result.data.app.byId.builds;
          };
          const builds=await read();
          const match=builds.find(b=>b.platform==='ANDROID' && b.appBuildVersion==='21' && b.gitCommitHash==='e735a3c97a8de743a1c49b7aaa6ccdedbf9ceabe');
          if(!match) throw new Error('La compilation intermédiaire exacte n’est pas identifiée');
          console.log(JSON.stringify({before:match}));
          if(['NEW','IN_QUEUE','IN_PROGRESS'].includes(match.status)){
            console.log(execFileSync('eas',['build:cancel',match.id,'--non-interactive'],{encoding:'utf8'}));
            const after=(await read()).find(b=>b.id===match.id);
            console.log(JSON.stringify({after}));
            if(!after || !['CANCELED','PENDING_CANCEL'].includes(after.status)) throw new Error('Annulation non confirmée');
          }else console.log('Aucune compilation active à arrêter.');
          JS
