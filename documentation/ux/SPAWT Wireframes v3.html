<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SPAWT · Wireframes mobile V3</title>
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: 'Kalam', cursive; }
  body { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="wireframe-kit.jsx"></script>
<script type="text/babel" src="screens-1.jsx"></script>
<script type="text/babel" src="screens-2.jsx"></script>
<script type="text/babel" src="screens-v2.jsx"></script>
<script type="text/babel" src="screens-v3.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "stade": "touriste",
  "premium": false,
  "voixChat": true,
  "showAnnotations": true
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const { stade, premium, voixChat, showAnnotations } = tweaks;

  return (
    <>
      <DesignCanvas title="SPAWT — Wireframes V1" subtitle="Persona core : Betsy · Superfan · Cocody · 27 ans">

        <DCSection id="intro" title="Note de cadrage V3" subtitle="Directions retenues · 1 mix B+C · 2 magazine · 3 sans radar · 6 carte raffinée">
          <DCArtboard id="brief" label="Brief & système" width={460} height={520}>
            <div className="wf" style={{ padding: 22, height: '100%', overflow: 'hidden', display: 'flex', flexDirection: 'column', gap: 12, fontFamily: 'Kalam, cursive' }}>
              <div className="wf-title" style={{ fontSize: 26, lineHeight: 1.05 }}>SPAWT · wireframes V1</div>
              <div className="wf-label" style={{ fontSize: 14 }}>très bas-fi · sketchy · noir/blanc + accents or & vert chat</div>
              <div className="wf-line"></div>

              <div className="wf-hand" style={{ fontSize: 16, fontWeight: 700, marginTop: 4 }}>Mes hypothèses</div>
              <ul className="wf-text" style={{ fontSize: 13, margin: 0, paddingLeft: 18, lineHeight: 1.4 }}>
                <li>Persona prioritaire : <b>Betsy</b> (Superfan, 27 ans, Cocody, 3-4 sorties/mois).</li>
                <li>Langue : <b>français</b>, ton dialecte SPAWT.</li>
                <li>5 axes du Palais visualisés en <b>radar pentagonal</b>.</li>
                <li>Couleurs réservées : <span style={{ color: '#c9a227', fontWeight: 700 }}>or</span> = premium / badges, <span style={{ color: '#4cae6e', fontWeight: 700 }}>vert chat</span> = CTA & validation.</li>
              </ul>

              <div className="wf-hand" style={{ fontSize: 16, fontWeight: 700, marginTop: 4 }}>6 écrans · 3 variations chacun</div>
              <ol className="wf-text" style={{ fontSize: 13, margin: 0, paddingLeft: 18, lineHeight: 1.4 }}>
                <li>Onboarding / calibrage Palais</li>
                <li>Feed personnalisé (accueil)</li>
                <li>Fiche lieu + ADN</li>
                <li>Le Spawt — check-in VTC</li>
                <li>Profil + Palais radar + collection</li>
                <li>Carte + paywall géo</li>
              </ol>

              <div className="wf-box-soft" style={{ padding: 10, marginTop: 'auto', background: '#fff7d6' }}>
                <div className="wf-hand" style={{ fontSize: 14, fontWeight: 700 }}>↗ Tweaks (en bas-droite)</div>
                <div className="wf-text" style={{ fontSize: 12, lineHeight: 1.3 }}>
                  Active la palette pour basculer le stade du spawter, Free vs Premium, et la voix du chat.
                </div>
              </div>
            </div>
          </DCArtboard>

          <DCArtboard id="legend" label="Légende sketchy" width={300} height={520}>
            <div className="wf" style={{ padding: 18, height: '100%', display: 'flex', flexDirection: 'column', gap: 10 }}>
              <div className="wf-title" style={{ fontSize: 18 }}>Légende</div>

              <div className="wf-hand" style={{ fontSize: 13, fontWeight: 700, marginTop: 6 }}>Boîtes</div>
              <div className="wf-box" style={{ padding: 6, fontSize: 11 }}>conteneur standard</div>
              <div className="wf-box-soft" style={{ padding: 6, fontSize: 11 }}>conteneur secondaire</div>
              <div className="wf-box-faint" style={{ padding: 6, fontSize: 11 }}>placeholder / désactivé</div>

              <div className="wf-hand" style={{ fontSize: 13, fontWeight: 700, marginTop: 6 }}>Pills / chips</div>
              <div style={{ display: 'flex', gap: 4, flexWrap: 'wrap' }}>
                <Pill>standard</Pill>
                <Pill fill>actif</Pill>
                <Pill or>premium</Pill>
                <Pill vert>CTA</Pill>
              </div>

              <div className="wf-hand" style={{ fontSize: 13, fontWeight: 700, marginTop: 6 }}>Image / photo</div>
              <ImgBox h={50} label="placeholder photo" />

              <div className="wf-hand" style={{ fontSize: 13, fontWeight: 700, marginTop: 6 }}>Voix du chat</div>
              <CatSays text="le chat parle ici" />
            </div>
          </DCArtboard>
        </DCSection>

        <DCSection id="onboarding" title="1 · Onboarding — retenu" subtitle="Cartes visuelles multi-select (mix B+C)">
          <DCArtboard id="onb-mix" label="Cartes visuelles" width={300} height={620}>
            <OnbMix voixChat={voixChat} />
          </DCArtboard>
        </DCSection>

        <DCSection id="feed" title="2 · Feed — retenu" subtitle="Style magazine culinaire (mix A+B)">
          <DCArtboard id="feed-mix" label="Magazine + dense" width={300} height={620}>
            <FeedMix stade={stade} voixChat={voixChat} />
          </DCArtboard>
        </DCSection>

        <DCSection id="fiche" title="3 · Fiche lieu — retenu" subtitle="Sans radar (gain de place) — ADN en tags + focus avis + mini-map">
          <DCArtboard id="fiche-final" label="Sans radar · focus avis" width={300} height={620}>
            <FicheV3Final />
          </DCArtboard>
        </DCSection>

        <DCSection id="spawt" title="4 · Le Spawt — check-in VTC" subtitle="3 moments du flow : notif système → sheet de notation → célébration">
          <DCArtboard id="spawt-a" label="Notif système (lock)" width={300} height={620}>
            <SpawtV1 voixChat={voixChat} />
          </DCArtboard>
          <DCArtboard id="spawt-b" label="Sheet de spawt" width={300} height={620}>
            <SpawtV2 voixChat={voixChat} />
          </DCArtboard>
          <DCArtboard id="spawt-c" label="Montée de stade" width={300} height={620}>
            <SpawtV3 />
          </DCArtboard>
        </DCSection>

        <DCSection id="profil" title="5 · Profil + Palais" subtitle="3 vues complémentaires de l'identité du spawter">
          <DCArtboard id="profil-a" label="Radar central" width={300} height={620}>
            <ProfilV1 premium={premium} />
          </DCArtboard>
          <DCArtboard id="profil-b" label="Collection titres" width={300} height={620}>
            <ProfilV2 />
          </DCArtboard>
          <DCArtboard id="profil-c" label="Journal du chat" width={300} height={620}>
            <ProfilV3 voixChat={voixChat} />
          </DCArtboard>
        </DCSection>

        <DCSection id="carte" title="6 · Carte — retenue" subtitle="Cercle 3km + flou au-delà + nudge Gold">
          <DCArtboard id="carte-retenue" label="Carte 3km + paywall" width={300} height={620}>
            <CarteRetenue premium={premium} />
          </DCArtboard>
        </DCSection>

        <DCSection id="next" title="Prochaines étapes" subtitle="Quand on a choisi 1-2 directions par écran">
          <DCArtboard id="next-1" label="To-do" width={460} height={300}>
            <div className="wf" style={{ padding: 22, height: '100%', display: 'flex', flexDirection: 'column', gap: 8 }}>
              <div className="wf-title" style={{ fontSize: 20 }}>après ce dégrossi</div>
              <ul className="wf-text" style={{ fontSize: 13, margin: 0, paddingLeft: 18, lineHeight: 1.5 }}>
                <li>↳ choisir 1 direction par écran (ou en mixer 2)</li>
                <li>↳ wireframer les écrans secondaires : recherche/filtres, avis détaillé, paywall full-screen, suggérer un lieu, badges</li>
                <li>↳ passer en mid-fi avec une vraie typo & l'icône chat travaillée</li>
                <li>↳ stress-test des copies "voix du chat" par stade (Touriste → Guide)</li>
                <li>↳ flow complet onboarding → 1er spawt (storyboard linéaire)</li>
              </ul>
            </div>
          </DCArtboard>
        </DCSection>

      </DesignCanvas>

      {showAnnotations && (
        <TweaksPanel title="Tweaks">
          <TweakSection title="Spawter">
            <TweakRadio
              label="stade"
              value={stade}
              options={[
                { value: 'touriste', label: 'Tour.' },
                { value: 'explorateur', label: 'Expl.' },
                { value: 'detective', label: 'Detect.' },
                { value: 'djidji', label: 'Djidji' },
              ]}
              onChange={v => setTweak('stade', v)}
            />
            <TweakToggle label="Spawter Gold (premium)" value={premium} onChange={v => setTweak('premium', v)} />
            <TweakToggle label="Voix du chat" value={voixChat} onChange={v => setTweak('voixChat', v)} />
          </TweakSection>
        </TweaksPanel>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
