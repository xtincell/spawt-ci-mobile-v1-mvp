# SPAWT — Checklist de conformité exécutable (version finale)
# Consommée par `node scripts/conformity-check.mjs` (voir scripts/README.md).
#
# 37 features : 19 MVP (PRD §3.1) + 18 post-MVP (PRD §4.1, Podcast marqué
# excluded — « Jamais dans l'app »). Chaque entrée porte des assertions
# vérifiables mécaniquement, établies par inspection du repo au 2026-07-26 :
#   files:      chemins (relatifs à la racine du repo) qui doivent exister
#   symbols:    "chemin#export" — l'export nommé doit exister dans le fichier
#   migrations: numéro NNNN — supabase/migrations/NNNN_*.sql + .down.sql apparié
#   i18n:       clé pointée de app/src/i18n/fr.json (une section compte aussi)
#   flags:      flag_code attendu dans supabase/seed/*.sql
#   deps:       dépendance attendue dans app/package.json
#   absent_pattern: regex qui ne doit PAS matcher dans app/src + app/app
#   expected_pending: true — écart connu/attendu → ⚠️ WARNING, pas ❌
#
# Syntaxe : sous-ensemble YAML (maps + listes de scalaires/maps, indentation
# 2 espaces, strings quotées optionnelles) parsé par le mini-parseur du script.

