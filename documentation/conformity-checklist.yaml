# ───────────── Textes exacts de la note MAJ (R2/R4/R5/R6/R7/R9/R11/R26) ─────────────
note_maj:
  texts:
    - ref: R2
      key: onboarding.neighborhood_body
      equals: "Pour t'afficher des lieux proches de toi."
    - ref: R4
      key: onboarding.age_body
      equals: "Pour te souhaiter Joyeux anniversaire, promis. (Et ça restera secret)"
    - ref: R5
      key: calibration.q_maquis_table.card.maquis_garba
      equals: "🍢 Garbadrome"
    - ref: R5
      key: calibration.q_maquis_table.card.foodtruck
      equals: "🚚 Foodtruck"
    - ref: R5
      key: calibration.q_maquis_table.card.restaurant_chic
      equals: "🍽️ Restaurant chic"
    - ref: R5
      key: calibration.q_maquis_table.card.brunch_cocody
      equals: "🥞 Brunch"
    - ref: R6
      key: home.modes_title
      equals: "Je sors pour…"
    - ref: R6
      key: modes.traine.label
      equals: "Manger"
    - ref: R6
      key: modes.decouvre.label
      equals: "Découvrir"
    - ref: R6
      key: modes.tribu.label
      equals: "En groupe"
    - ref: R6
      key: modes.chic.label
      equals: "En duo"
    - ref: R7
      key: home.suggestions_title
      equals: "Voici mes 3 suggestions du jour."
    - ref: R9
      key: palais_reveal.first_title
      equals: "Voici ton palais"
    - ref: R11
      key: place.spawt_cta
      equals: "Spawt le !"
    - ref: R26
      key: onboarding.origin_country_body
      equals: "Pour te proposer les goûts de chez toi. (Optionnel, promis)"
  contains:
    - ref: "#V07"
      file: app/app/(onboarding)/otp.tsx
      contains: "const CELL_COUNT = 6"
    - ref: "#V07"
      file: app/app/(onboarding)/otp.tsx
      contains: "const DEMO_CODE = \"123456\""
    - ref: "#V07"
      file: supabase/functions/otp-verify/index.ts
      contains: "const MOCK_OTP_CODE = \"123456\""
  no_on_pronoun:
    ref: R13
    file: app/src/i18n/fr.json
    allow:
      - "« On mange où ce soir ? »"

# ─────────────────────────── Contrat SPAWT (anti-compétition) ───────────────────────────
contrat_spawt:
  sql_table_lacks_column:
    - migration: 0040
      table: challenge_progress
      column: spawter_id
      note: "Le Contrat interdit tout classement : progrès agrégé, 1 ligne par défi, aucune donnée individuelle."
  grep_absent:
    - id: no-competition-vocab
      paths:
        - app/src
        - app/app
      pattern: "\\b(leaderboard|classement|ranking)\\b"
      strip_comments: true
      note: "Redonde lint:vocab — défense en profondeur."

# ──────────────────────────────── Direction artistique ────────────────────────────────
da:
  hex_scan:
    paths:
      - app/src
      - app/app
      - app/__tests__
    exclude:
      - app/src/theme/tokens.ts
    note: "Aucun hex hors tokens.ts (source unique brandbook)."

# ─────────────────────────────── Enveloppe de livraison ───────────────────────────────
enveloppe:
  deps:
    - react-native-view-shot
    - expo-sharing
    - "@maplibre/maplibre-react-native"
    - "@react-native-community/datetimepicker"
    - expo-image-picker
  eas_submit:
    file: app/eas.json
    placeholder_marker: REMPLACER_
    expected_pending: true
    note: "ascAppId/appleTeamId restent des placeholders tant qu'Alexandre n'a pas les comptes stores (HUMAN_TODO) — WARNING attendu, pas un échec."
